<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      :root { --accent: #2e6bff; --accentg: rgba(46,107,255,0.9); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      body { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; }

      #scene { position: absolute; inset: 0; }
      #bg, #fg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

      /* STRAVA wordmark, sits BEHIND the subject cutout */
      #strava { position: absolute; left: 0; right: 0; top: 985px; text-align: center; white-space: nowrap;
        font-size: 344px; font-weight: 900; letter-spacing: 26px; color: #f7f6f3;
        text-shadow: 0 8px 50px rgba(0,0,0,0.55); opacity: 0; will-change: transform, opacity; }

      .grade { position: absolute; inset: 0; pointer-events: none; }
      .grade-top { background: linear-gradient(180deg, rgba(0,0,0,0.72), rgba(0,0,0,0.2) 22%, rgba(0,0,0,0) 40%); }
      .grade-vignette { background: radial-gradient(ellipse 84% 72% at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.5) 100%); }
      .grade-grain { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='11' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); background-size: 300px 300px; opacity: 0.05; mix-blend-mode: overlay; }

      /* Strava-style stats header */
      #head { position: absolute; top: 118px; left: 56px; right: 56px; display: flex; justify-content: space-between; }
      #head .col { display: flex; flex-direction: column; opacity: 0; will-change: transform, opacity; }
      #head .col.mid { align-items: center; }
      #head .col.end { align-items: flex-end; }
      #head .lbl { font-size: 27px; font-weight: 600; letter-spacing: 0.02em; color: rgba(255,255,255,0.82); margin-bottom: 4px; }
      #head .val { font-size: 66px; font-weight: 800; letter-spacing: -0.01em; color: #ffffff; font-variant-numeric: tabular-nums; line-height: 1; text-shadow: 0 3px 18px rgba(0,0,0,0.6); }
      #head .val .u { font-size: 34px; font-weight: 700; margin-left: 4px; color: rgba(255,255,255,0.7); }
      #head .tick { width: 48px; height: 4px; margin-top: 16px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 10px var(--accentg); transform: scaleX(0); transform-origin: center center; }

      #outline { position: absolute; inset: 0; pointer-events: none; }
      #ol-glow { fill: none; stroke: var(--accent); stroke-width: 22; stroke-linecap: round; stroke-linejoin: round; opacity: 0.35; filter: blur(9px); }
      #ol-path { fill: none; stroke: var(--accent); stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 6px var(--accent)); }
      #ol-halo { fill: rgba(46,107,255,0.28); opacity: 0; }
      #ol-dot { fill: #eaf1ff; opacity: 0; filter: drop-shadow(0 0 8px var(--accent)) drop-shadow(0 0 20px var(--accentg)); }

      /* Sketch / doodle layer */
      #sketch { position: absolute; inset: 0; pointer-events: none; }
      #sketch path { fill: none; stroke: var(--accent); stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 5px var(--accentg)); }
      #sk-circle, #sk-shaft, #sk-head { stroke-width: 7; }
      #sketch .spk { stroke-width: 5; }
      #sk-note { position: absolute; left: 604px; top: 1636px; color: #6f9dff; font-weight: 800; font-size: 46px; letter-spacing: 0.01em; transform: rotate(-6deg); text-shadow: 0 3px 12px rgba(0,0,0,0.7); opacity: 0; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1080" data-height="1920">
      <div id="scene">
        <img id="bg" src="shoes.jpg" alt="" />
        <div id="strava">STRAVA</div>
        <img id="fg" src="shoes_cutout.png" alt="" />
      </div>

      <div class="grade grade-top"></div>
      <div class="grade grade-vignette"></div>
      <div class="grade grade-grain"></div>

      <!-- Hand-drawn outline around the subject -->
      <svg id="outline" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
        <path id="ol-glow" d="M 827.2 1306.5 L 825.1 1357.0 L 800.3 1403.6 L 765.2 1443.6 L 736.6 1483.1 L 714.9 1526.9 L 686.1 1567.6 L 643.1 1593.7 L 594.7 1606.1 L 551.4 1617.8 L 512.8 1636.6 L 473.1 1656.1 L 430.3 1667.9 L 385.3 1673.2 L 336.8 1675.3 L 286.6 1667.4 L 244.2 1638.8 L 217.2 1591.5 L 198.5 1540.3 L 173.7 1494.8 L 141.7 1450.8 L 118.0 1400.6 L 113.4 1345.7 L 119.6 1292.4 L 122.4 1242.0 L 121.1 1191.8 L 125.6 1142.5 L 139.7 1096.3 L 158.0 1051.2 L 180.1 1005.4 L 214.6 967.1 L 265.7 949.2 L 324.1 952.2 L 378.3 959.5 L 427.4 956.7 L 477.3 949.1 L 528.2 951.8 L 575.1 968.9 L 617.8 990.4 L 660.8 1009.6 L 703.2 1031.4 L 738.9 1061.6 L 768.0 1098.1 L 797.8 1137.0 L 827.0 1180.9 L 840.0 1233.0 L 824.1 1288.8" />
        <path id="ol-path" d="M 827.2 1306.5 L 825.1 1357.0 L 800.3 1403.6 L 765.2 1443.6 L 736.6 1483.1 L 714.9 1526.9 L 686.1 1567.6 L 643.1 1593.7 L 594.7 1606.1 L 551.4 1617.8 L 512.8 1636.6 L 473.1 1656.1 L 430.3 1667.9 L 385.3 1673.2 L 336.8 1675.3 L 286.6 1667.4 L 244.2 1638.8 L 217.2 1591.5 L 198.5 1540.3 L 173.7 1494.8 L 141.7 1450.8 L 118.0 1400.6 L 113.4 1345.7 L 119.6 1292.4 L 122.4 1242.0 L 121.1 1191.8 L 125.6 1142.5 L 139.7 1096.3 L 158.0 1051.2 L 180.1 1005.4 L 214.6 967.1 L 265.7 949.2 L 324.1 952.2 L 378.3 959.5 L 427.4 956.7 L 477.3 949.1 L 528.2 951.8 L 575.1 968.9 L 617.8 990.4 L 660.8 1009.6 L 703.2 1031.4 L 738.9 1061.6 L 768.0 1098.1 L 797.8 1137.0 L 827.0 1180.9 L 840.0 1233.0 L 824.1 1288.8" />
        <circle id="ol-halo" r="34" cx="827" cy="1306" />
        <circle id="ol-dot" r="13" cx="827" cy="1306" />
      </svg>

      <!-- Sketch / doodle layer -->
      <svg id="sketch" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
        <path id="sk-circle" d="M 281.0 106.6 L 295.9 112.9 L 306.2 121.5 L 308.4 131.7 L 303.2 141.7 L 294.0 150.6 L 283.6 159.0 L 272.3 167.3 L 258.1 174.9 L 239.9 180.2 L 219.2 182.5 L 198.3 183.7 L 178.1 186.4 L 157.4 191.4 L 134.9 196.4 L 111.3 198.0 L 88.9 194.7 L 69.6 187.6 L 52.9 179.7 L 37.4 172.4 L 22.9 165.1 L 11.8 156.7 L 6.4 147.2 L 6.5 137.9 L 8.9 129.6 L 10.7 121.3 L 12.0 111.8 L 16.3 101.1 L 27.0 91.2 L 44.5 84.1 L 66.1 80.3 L 88.9 77.9 L 112.0 75.3 L 135.9 72.9 L 160.3 72.9" />
        <path id="sk-shaft" d="M 880 1640 C 820 1560 760 1520 690 1486" />
        <path id="sk-head" d="M 690 1486 L 726 1500 M 690 1486 L 706 1450" />
        <path class="spk" d="M0 -13 L3.5 -3.5 L13 0 L3.5 3.5 L0 13 L-3.5 3.5 L-13 0 L-3.5 -3.5 Z" transform="translate(345 150)" />
        <path class="spk" d="M0 -13 L3.5 -3.5 L13 0 L3.5 3.5 L0 13 L-3.5 3.5 L-13 0 L-3.5 -3.5 Z" transform="translate(915 1045) scale(1.4)" />
        <path class="spk" d="M0 -13 L3.5 -3.5 L13 0 L3.5 3.5 L0 13 L-3.5 3.5 L-13 0 L-3.5 -3.5 Z" transform="translate(250 1585) scale(1.15)" />
      </svg>
      <div id="sk-note">run leg &#10003;</div>

      <!-- Strava-style stats header -->
      <div id="head">
        <div class="col"><span class="lbl">Distance</span><span class="val"><span id="v-dist">0.0</span><span class="u">km</span></span><span class="tick"></span></div>
        <div class="col mid"><span class="lbl">Pace</span><span class="val">6:00<span class="u">/km</span></span><span class="tick"></span></div>
        <div class="col end"><span class="lbl">Time</span><span class="val" id="v-time">0:00</span><span class="tick"></span></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // STRAVA wordmark reveals behind the subject
      tl.fromTo("#strava", { autoAlpha: 0, y: 40, scale: 1.1 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.9, ease: "power3.out", immediateRender: false }, 0.4);

      // Stats header: columns rise in, values count up
      tl.fromTo("#head .col", { autoAlpha: 0, y: -24 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.12, immediateRender: false }, 0.5);
      const dS = { v: 0 }, dE = document.getElementById("v-dist");
      tl.to(dS, { v: 7.5, duration: 1.6, ease: "power2.out", onUpdate: () => { dE.textContent = dS.v.toFixed(1); } }, 0.9);
      const tS = { v: 0 }, tE = document.getElementById("v-time");
      tl.to(tS, { v: 2700, duration: 1.6, ease: "power2.out", onUpdate: () => { const s = Math.round(tS.v); tE.textContent = Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); } }, 0.9);

      // Blue accent ticks wipe in under each stat
      tl.fromTo("#head .tick", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out", stagger: 0.1, immediateRender: false }, 1.6);

      // Outline draws on, led by a glowing GPS tracker dot, then the dot orbits
      const ol = document.getElementById("ol-path");
      const olg = document.getElementById("ol-glow");
      const dot = document.getElementById("ol-dot");
      const halo = document.getElementById("ol-halo");
      const olen = ol.getTotalLength();
      [ol, olg].forEach((p) => { p.style.strokeDasharray = olen; p.style.strokeDashoffset = olen; });
      function setDot(f) {
        const frac = f - Math.floor(f);
        const pt = ol.getPointAtLength(frac * olen);
        dot.setAttribute("cx", pt.x.toFixed(1)); dot.setAttribute("cy", pt.y.toFixed(1));
        halo.setAttribute("cx", pt.x.toFixed(1)); halo.setAttribute("cy", pt.y.toFixed(1));
      }
      setDot(0);
      // line + glow draw (linear so the head matches the dot)
      tl.to([ol, olg], { strokeDashoffset: 0, duration: 2.0, ease: "none" }, 1.4);
      // tracker dot appears and leads the draw, then keeps orbiting the loop
      tl.fromTo([dot, halo], { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.25, immediateRender: false }, 1.4);
      const dp = { f: 0 };
      tl.to(dp, { f: 1, duration: 2.0, ease: "none", onUpdate: () => setDot(dp.f) }, 1.4);
      tl.to(dp, { f: 2.4, duration: 3.0, ease: "none", onUpdate: () => setDot(dp.f) }, 3.4);
      // halo breathes as it travels
      tl.to(halo, { attr: { r: 46 }, duration: 0.9, ease: "sine.inOut", repeat: 4, yoyo: true, immediateRender: false }, 1.7);
      tl.to([dot, halo], { autoAlpha: 0, duration: 0.5, ease: "power2.in" }, 6.3);
      // finished line gives a gentle neon pulse
      tl.fromTo(ol, { opacity: 1 }, { opacity: 0.68, duration: 0.9, ease: "sine.inOut", repeat: 3, yoyo: true, immediateRender: false }, 3.5);

      // Sketch doodles draw themselves on, like live annotation
      function drawOn(el, at, dur){ const L = el.getTotalLength(); el.style.strokeDasharray = L; el.style.strokeDashoffset = L; tl.to(el, { strokeDashoffset: 0, duration: dur, ease: "power1.inOut" }, at); }
      drawOn(document.getElementById("sk-circle"), 3.6, 0.8);
      drawOn(document.getElementById("sk-shaft"), 4.6, 0.5);
      drawOn(document.getElementById("sk-head"), 5.05, 0.3);
      document.querySelectorAll("#sketch .spk").forEach((p, i) => drawOn(p, 4.3 + i * 0.28, 0.4));
      tl.fromTo("#sk-note", { autoAlpha: 0, y: 16, rotate: -14 }, { autoAlpha: 1, y: 0, rotate: -6, duration: 0.5, ease: "back.out(1.6)", immediateRender: false }, 5.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
