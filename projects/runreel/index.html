<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      :root { --red: #e8110b; --redg: rgba(232, 17, 11, 0.85); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      body { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; }

      /* ---- Monochrome grade ---- */
      .grade { position: absolute; inset: 0; pointer-events: none; }
      .grade-contrast { background: linear-gradient(180deg, rgba(0,0,0,0.24), rgba(0,0,0,0) 26%, rgba(0,0,0,0) 66%, rgba(0,0,0,0.36)); mix-blend-mode: multiply; }
      .grade-vignette { background: radial-gradient(ellipse 80% 66% at 50% 46%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.62) 100%); }
      .grade-grain {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='11' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
        background-size: 300px 300px; opacity: 0.09; mix-blend-mode: overlay;
      }

      /* ---- Type ---- */
      .beat { position: absolute; left: 0; right: 0; padding: 0 92px; display: flex; flex-direction: column; align-items: flex-start; }
      .beat-inner { opacity: 0; will-change: transform, opacity; }
      .kicker { font-size: 30px; font-weight: 700; letter-spacing: 0.4em; text-transform: uppercase; color: #f4f4f2; text-shadow: 0 2px 16px rgba(0,0,0,0.7); }
      .kicker .dot { color: var(--red); margin: 0 0.5em; }
      .line { font-size: 116px; line-height: 0.94; font-weight: 800; letter-spacing: -0.02em; text-transform: uppercase; color: #f6f6f4; text-shadow: 0 4px 40px rgba(0,0,0,0.78); }
      .line span { display: block; will-change: transform, opacity; }
      .line .accent { -webkit-text-stroke: 3px var(--red); -webkit-text-fill-color: rgba(232,17,11,0.34); color: rgba(232,17,11,0.34); }
      .rule { width: 104px; height: 8px; background: var(--red); margin-bottom: 30px; transform-origin: left center; box-shadow: 0 0 18px var(--redg); }

      /* ---- Closing ---- */
      #closing { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #closing .card-inner { opacity: 0; display: flex; flex-direction: column; align-items: center; will-change: transform, opacity; padding: 64px 80px; border-radius: 34px; background: rgba(0,0,0,0.72); border: 1px solid rgba(232,17,11,0.5); box-shadow: 0 20px 70px rgba(0,0,0,0.6); }
      .mark { width: 132px; height: 132px; border-radius: 50%; border: 4px solid var(--red); display: flex; align-items: center; justify-content: center; margin-bottom: 38px; box-shadow: 0 0 34px var(--redg); }
      .handle { font-size: 86px; font-weight: 800; letter-spacing: -0.01em; color: #f6f6f4; text-shadow: 0 4px 30px rgba(0,0,0,0.7); }
      .handle b { color: #f6f6f4; font-weight: 800; }
      .under { width: 200px; height: 6px; background: var(--red); margin-top: 20px; box-shadow: 0 0 16px var(--redg); transform-origin: center; }
      .sub { margin-top: 22px; font-size: 32px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #f0efec; font-variant-numeric: tabular-nums; text-shadow: 0 2px 14px rgba(0,0,0,0.7); }
      .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.28) 34%, rgba(0,0,0,0.28) 60%, rgba(0,0,0,0.74)); }

      /* ---- HUD (red) ---- */
      .corner { position: absolute; width: 82px; height: 82px; border: 5px solid var(--red); opacity: 0; box-shadow: 0 0 14px var(--redg); }
      .corner.tl { top: 46px; left: 46px; border-right: none; border-bottom: none; }
      .corner.tr { top: 46px; right: 46px; border-left: none; border-bottom: none; }
      .corner.bl { bottom: 46px; left: 46px; border-right: none; border-top: none; }
      .corner.br { bottom: 46px; right: 46px; border-left: none; border-top: none; }

      #telemetry { position: absolute; top: 150px; left: 64px; }
      #telemetry .tele-inner { display: flex; align-items: center; gap: 16px; opacity: 0; padding: 14px 26px; border-radius: 999px; background: rgba(0,0,0,0.55); border: 1px solid var(--redg); }
      .tele-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--red); box-shadow: 0 0 16px var(--red); }
      .tele-label { font-size: 25px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #f4f4f2; }
      .tele-time { font-size: 25px; font-weight: 700; color: var(--red); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }

      #pace { position: absolute; top: 150px; right: 64px; }
      #pace .pc-inner { opacity: 0; width: 250px; padding: 16px 18px 14px; border-radius: 20px; background: rgba(0,0,0,0.74); border: 1px solid var(--redg); }
      #pace .pc-title { font-size: 19px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(244,244,242,0.9); margin-bottom: 8px; display: flex; justify-content: space-between; }
      #pace .pc-title b { color: #ffffff; }
      #pace svg { display: block; width: 100%; height: 72px; }
      #pace polyline { fill: none; stroke: var(--red); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 4px var(--redg)); }
      #pace .pc-dot { fill: var(--red); opacity: 0; }

      #stats { position: absolute; left: 48px; right: 48px; bottom: 104px; }
      #stats .st-inner { opacity: 0; display: flex; justify-content: space-between; align-items: center; padding: 30px 34px; border-radius: 24px; background: rgba(0,0,0,0.56); border: 1px solid var(--redg); }
      #stats .st-cell { display: flex; flex-direction: column; align-items: center; flex: 1; }
      #stats .st-val { font-size: 60px; font-weight: 800; color: var(--red); font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.02em; text-shadow: 0 0 16px rgba(232,17,11,0.5); }
      #stats .st-val .u { font-size: 26px; font-weight: 700; color: rgba(255,255,255,0.85); margin-left: 5px; text-shadow: none; }
      #stats .st-key { margin-top: 13px; font-size: 23px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(246,246,244,0.72); }
      #stats .st-div { width: 1px; height: 78px; background: var(--redg); }

      /* Tracking reticle (hero) */
      #reticle { position: absolute; left: 50%; top: 1000px; width: 300px; height: 300px; margin-left: -150px; margin-top: -150px; opacity: 0; pointer-events: none; }
      #reticle .rb { position: absolute; width: 46px; height: 46px; border: 4px solid var(--red); box-shadow: 0 0 10px var(--redg); }
      #reticle .rb.tl { top: 0; left: 0; border-right: none; border-bottom: none; }
      #reticle .rb.tr { top: 0; right: 0; border-left: none; border-bottom: none; }
      #reticle .rb.bl { bottom: 0; left: 0; border-right: none; border-top: none; }
      #reticle .rb.br { bottom: 0; right: 0; border-left: none; border-top: none; }
      #reticle .rtag { position: absolute; top: -40px; left: 0; font-size: 20px; font-weight: 700; letter-spacing: 0.2em; color: var(--red); text-transform: uppercase; }

      /* Red scan sweep */
      #scan { position: absolute; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(90deg, transparent, var(--red), transparent); opacity: 0; box-shadow: 0 0 20px var(--red); pointer-events: none; }

      #progress { position: absolute; left: 0; bottom: 0; height: 8px; width: 100%; transform-origin: left center; transform: scaleX(0); background: var(--red); box-shadow: 0 -1px 14px var(--red); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10.83" data-width="1080" data-height="1920">
      <video id="a-roll" class="clip" src="combined2.mp4" muted playsinline data-start="0" data-duration="10.83" data-track-index="0" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover"></video>

      <div class="grade grade-contrast"></div>
      <div class="grade grade-vignette"></div>
      <div class="grade grade-grain"></div>

      <!-- Opening kicker + title -->
      <div id="beat-a" class="clip beat" style="top: 150px" data-start="0.3" data-duration="1.7" data-track-index="4">
        <div class="beat-inner"><div class="kicker">07:12 AM<span class="dot">·</span>7.5 KM</div></div>
      </div>
      <div id="beat-open" class="clip beat" style="top: 1330px" data-start="0.4" data-duration="1.7" data-track-index="9">
        <div class="beat-inner"><div class="line"><span>Sunday</span><span class="accent">miles</span></div></div>
      </div>

      <!-- Hero line -->
      <div id="beat-hero" class="clip beat" style="top: 1330px" data-start="4.2" data-duration="3.0" data-track-index="4">
        <div class="beat-inner"><div class="rule"></div><div class="line"><span>Don't</span><span class="accent">stop</span></div></div>
      </div>

      <!-- HUD corners -->
      <div id="hud-corners" class="clip" style="position:absolute; inset:0; pointer-events:none" data-start="2.0" data-duration="5.7" data-track-index="3">
        <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      </div>

      <!-- Telemetry -->
      <div id="telemetry" class="clip" data-start="2.4" data-duration="5.3" data-track-index="6">
        <div class="tele-inner"><span class="tele-dot"></span><span class="tele-label">Tracking</span><span class="tele-time" id="tele-time">0:00</span></div>
      </div>

      <!-- Pace sparkline -->
      <div id="pace" class="clip" data-start="2.8" data-duration="4.9" data-track-index="7">
        <div class="pc-inner">
          <div class="pc-title"><span>Pace / km</span><b>6:00</b></div>
          <svg viewBox="0 0 214 72" xmlns="http://www.w3.org/2000/svg">
            <polyline id="pc-line" points="" />
            <circle class="pc-dot" id="pc-dot" cx="0" cy="0" r="6" />
          </svg>
        </div>
      </div>

      <!-- Stats bar -->
      <div id="stats" class="clip" data-start="2.5" data-duration="5.2" data-track-index="8">
        <div class="st-inner">
          <div class="st-cell"><div class="st-val"><span id="st-dist">0.0</span><span class="u">km</span></div><div class="st-key">Distance</div></div>
          <div class="st-div"></div>
          <div class="st-cell"><div class="st-val"><span id="st-pace">6:00</span><span class="u">/km</span></div><div class="st-key">Avg Pace</div></div>
          <div class="st-div"></div>
          <div class="st-cell"><div class="st-val"><span id="st-cal">0</span><span class="u">kcal</span></div><div class="st-key">Calories</div></div>
        </div>
      </div>

      <!-- Tracking reticle (hero) -->
      <div id="reticle" class="clip" data-start="3.7" data-duration="3.5" data-track-index="10">
        <div class="rtag">Subject</div>
        <div class="rb tl"></div><div class="rb tr"></div><div class="rb bl"></div><div class="rb br"></div>
      </div>

      <!-- Red scan sweep -->
      <div id="scan" class="clip" data-start="3.6" data-duration="3.6" data-track-index="11"></div>

      <!-- Closing -->
      <div id="closing" class="clip" data-start="7.7" data-duration="3.13" data-track-index="5">
        <div class="scrim"></div>
        <div class="card-inner">
          <div class="mark">
            <svg width="68" height="68" viewBox="0 0 24 24" fill="none" stroke="#e8110b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="17" cy="5" r="2" />
              <path d="M6.5 21 9 14l4-2-3-4-3 2-2 3" />
              <path d="M13 12l3 2 1 4" />
              <path d="M10 8l4 1 3-3" />
            </svg>
          </div>
          <div class="handle">@ted<b>yatra</b></div>
          <div class="under"></div>
          <div class="sub">7.5 km · 45:00 · 6:00 /km</div>
        </div>
      </div>

      <div id="progress"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Kinetic text: words rise + slam in with stagger, red rule wipes
      function beat(id, start, dur, big) {
        const inner = "#" + id + " .beat-inner";
        const words = document.querySelectorAll("#" + id + " .line span");
        tl.fromTo(inner, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.25, ease: "none", immediateRender: false }, start);
        if (words.length) {
          tl.fromTo(words, { autoAlpha: 0, y: 70, scaleY: 1.3 }, { autoAlpha: 1, y: 0, scaleY: 1, duration: 0.55, ease: "back.out(1.6)", stagger: 0.12, immediateRender: false }, start + 0.05);
        } else {
          tl.fromTo(inner, { y: 30 }, { y: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, start);
        }
        const rule = "#" + id + " .rule";
        if (document.querySelector(rule)) {
          tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, start + 0.1);
        }
        tl.to(inner, { autoAlpha: 0, y: -28, duration: 0.45, ease: "power2.in" }, start + dur - 0.45);
      }
      beat("beat-a", 0.3, 1.7);
      beat("beat-open", 0.4, 1.7);
      beat("beat-hero", 4.2, 3.0);

      // Closing card
      tl.fromTo("#closing .card-inner", { autoAlpha: 0, y: 44, scale: 0.92 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.85, ease: "back.out(1.4)", immediateRender: false }, 8.0);

      // Progress
      tl.fromTo("#progress", { scaleX: 0 }, { scaleX: 1, duration: 10.83, ease: "none", immediateRender: false }, 0);

      // ---------- Motion graphics (Ironman red) ----------
      const HUD_OUT = 7.3;

      // Corners: scale + slight rotate in, then hold
      gsap.set(".corner", { transformOrigin: "center center" });
      tl.fromTo(".corner", { autoAlpha: 0, scale: 0.3, rotate: -12 }, { autoAlpha: 1, scale: 1, rotate: 0, duration: 0.6, ease: "back.out(1.8)", stagger: 0.07, immediateRender: false }, 2.0);
      tl.to(".corner", { autoAlpha: 0, duration: 0.4, ease: "power2.in" }, HUD_OUT);

      // Telemetry + clock -> 45:00
      tl.fromTo("#telemetry .tele-inner", { autoAlpha: 0, x: -34 }, { autoAlpha: 1, x: 0, duration: 0.55, ease: "back.out(1.5)", immediateRender: false }, 2.4);
      tl.fromTo(".tele-dot", { scale: 0.6, autoAlpha: 0.6 }, { scale: 1.2, autoAlpha: 1, duration: 0.55, ease: "sine.inOut", repeat: 8, yoyo: true, immediateRender: false }, 2.7);
      const teleState = { v: 0 }, teleEl = document.getElementById("tele-time");
      tl.to(teleState, { v: 2700, duration: 3.4, ease: "power2.out", onUpdate: () => { const s = Math.round(teleState.v); teleEl.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); } }, 2.7);
      tl.to("#telemetry .tele-inner", { autoAlpha: 0, x: -22, duration: 0.4, ease: "power2.in" }, HUD_OUT);

      // Pace sparkline
      const paces = [382, 366, 358, 361, 350, 372, 346];
      const pmin = Math.min(...paces), pmax = Math.max(...paces);
      const PW = 214, PH = 72, pad = 10;
      const pts = paces.map((p, i) => [pad + (PW - 2 * pad) * (i / (paces.length - 1)), pad + (PH - 2 * pad) * ((p - pmin) / (pmax - pmin || 1))]);
      const line = document.getElementById("pc-line");
      line.setAttribute("points", pts.map(([x, y]) => x.toFixed(1) + "," + y.toFixed(1)).join(" "));
      const last = pts[pts.length - 1], dotEl = document.getElementById("pc-dot");
      dotEl.setAttribute("cx", last[0].toFixed(1)); dotEl.setAttribute("cy", last[1].toFixed(1));
      const plen = line.getTotalLength();
      line.style.strokeDasharray = plen; line.style.strokeDashoffset = plen;
      tl.fromTo("#pace .pc-inner", { autoAlpha: 0, y: -26, x: 20 }, { autoAlpha: 1, y: 0, x: 0, duration: 0.55, ease: "back.out(1.5)", immediateRender: false }, 2.9);
      tl.to(line, { strokeDashoffset: 0, duration: 1.4, ease: "power1.inOut" }, 3.3);
      tl.fromTo("#pc-dot", { autoAlpha: 0, scale: 0 }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: "back.out(2.4)", transformOrigin: "center center", immediateRender: false }, 4.6);
      tl.to("#pace .pc-inner", { autoAlpha: 0, y: -18, duration: 0.4, ease: "power2.in" }, HUD_OUT);

      // Stats bar: distance + calories count up
      tl.fromTo("#stats .st-inner", { autoAlpha: 0, y: 66 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "back.out(1.3)", immediateRender: false }, 2.5);
      function countUp(id, target, decimals, at) {
        const o = { v: 0 }, el = document.getElementById(id);
        tl.to(o, { v: target, duration: 1.5, ease: "power2.out", onUpdate: () => { el.textContent = decimals ? o.v.toFixed(decimals) : String(Math.round(o.v)); } }, at);
      }
      countUp("st-dist", 7.5, 1, 3.0);
      countUp("st-cal", 486, 0, 3.0);
      tl.to("#stats .st-inner", { autoAlpha: 0, y: 40, duration: 0.4, ease: "power2.in" }, HUD_OUT);

      // Tracking reticle over the hero run
      gsap.set("#reticle", { transformOrigin: "center center" });
      tl.fromTo("#reticle", { autoAlpha: 0, scale: 1.5, rotate: 8 }, { autoAlpha: 1, scale: 1, rotate: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 3.7);
      tl.to("#reticle", { scale: 1.06, duration: 0.7, ease: "sine.inOut", repeat: 2, yoyo: true }, 4.3);
      tl.to("#reticle", { autoAlpha: 0, scale: 1.3, duration: 0.3, ease: "power2.in" }, 6.9);
      tl.set("#reticle", { autoAlpha: 0 }, 7.2);

      // Red scan sweep down the frame (twice)
      tl.set("#scan", { autoAlpha: 1 }, 3.6);
      tl.fromTo("#scan", { y: 0 }, { y: 1920, duration: 1.7, ease: "power1.inOut", repeat: 1, immediateRender: false }, 3.6);
      tl.to("#scan", { autoAlpha: 0, duration: 0.3 }, 7.0);
      tl.set("#scan", { autoAlpha: 0 }, 7.2);

      // Hard-kill sets so non-linear seeks never leave HUD painted past its exit
      tl.set(".corner", { autoAlpha: 0 }, 7.7);
      tl.set("#telemetry .tele-inner", { autoAlpha: 0 }, 7.7);
      tl.set("#pace .pc-inner", { autoAlpha: 0 }, 7.7);
      tl.set("#stats .st-inner", { autoAlpha: 0 }, 7.7);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
