<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      body { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; }

      /* ---- Monochrome grade (always-on children) ---- */
      .grade { position: absolute; inset: 0; pointer-events: none; }
      .grade-contrast {
        background: linear-gradient(180deg, rgba(0,0,0,0.22), rgba(0,0,0,0) 26%, rgba(0,0,0,0) 66%, rgba(0,0,0,0.34));
        mix-blend-mode: multiply;
      }
      .grade-vignette {
        background: radial-gradient(ellipse 80% 66% at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.6) 100%);
      }
      .grade-grain {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='11' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
        background-size: 300px 300px;
        opacity: 0.09;
        mix-blend-mode: overlay;
      }

      /* ---- Type ---- */
      .beat { position: absolute; left: 0; right: 0; padding: 0 92px; display: flex; flex-direction: column; align-items: flex-start; }
      .beat-inner { opacity: 0; will-change: transform, opacity; }
      .kicker {
        font-size: 30px; font-weight: 700; letter-spacing: 0.4em; text-transform: uppercase;
        color: #f4f4f2; text-shadow: 0 2px 16px rgba(0,0,0,0.7);
      }
      .kicker .dot { color: rgba(255,255,255,0.5); margin: 0 0.5em; }
      .line {
        font-size: 112px; line-height: 0.96; font-weight: 800; letter-spacing: -0.02em;
        text-transform: uppercase; color: #f6f6f4; text-shadow: 0 4px 40px rgba(0,0,0,0.75);
      }
      .line span { display: block; }
      .line .accent { -webkit-text-stroke: 3px #f6f6f4; -webkit-text-fill-color: rgba(246,246,244,0.32); color: rgba(246,246,244,0.32); }
      .rule { width: 92px; height: 6px; background: #f6f6f4; margin-bottom: 32px; transform-origin: left center; box-shadow: 0 2px 14px rgba(0,0,0,0.6); }

      /* ---- Closing ---- */
      #closing { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #closing .card-inner { opacity: 0; display: flex; flex-direction: column; align-items: center; will-change: transform, opacity; }
      .mark { width: 128px; height: 128px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center; margin-bottom: 38px; box-shadow: 0 8px 40px rgba(0,0,0,0.6); }
      .handle { font-size: 84px; font-weight: 800; letter-spacing: -0.01em; color: #f6f6f4; text-shadow: 0 4px 30px rgba(0,0,0,0.7); }
      .sub { margin-top: 22px; font-size: 32px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(246,246,244,0.85); font-variant-numeric: tabular-nums; }
      .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.5), rgba(0,0,0,0.25) 34%, rgba(0,0,0,0.25) 60%, rgba(0,0,0,0.72)); }

      /* ---- HUD ---- */
      .corner { position: absolute; width: 78px; height: 78px; border: 5px solid rgba(255,255,255,0.85); opacity: 0; }
      .corner.tl { top: 46px; left: 46px; border-right: none; border-bottom: none; }
      .corner.tr { top: 46px; right: 46px; border-left: none; border-bottom: none; }
      .corner.bl { bottom: 46px; left: 46px; border-right: none; border-top: none; }
      .corner.br { bottom: 46px; right: 46px; border-left: none; border-top: none; }

      #telemetry { position: absolute; top: 150px; left: 64px; }
      #telemetry .tele-inner { display: flex; align-items: center; gap: 16px; opacity: 0; padding: 14px 26px; border-radius: 999px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); }
      .tele-dot { width: 15px; height: 15px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 14px rgba(255,255,255,0.9); }
      .tele-label { font-size: 25px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #f4f4f2; }
      .tele-time { font-size: 25px; font-weight: 700; color: #ffffff; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }

      #pace { position: absolute; top: 150px; right: 64px; }
      #pace .pc-inner { opacity: 0; width: 250px; padding: 16px 18px 14px; border-radius: 20px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); }
      #pace .pc-title { font-size: 19px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(244,244,242,0.85); margin-bottom: 8px; display: flex; justify-content: space-between; }
      #pace svg { display: block; width: 100%; height: 72px; }
      #pace polyline { fill: none; stroke: #ffffff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      #pace .pc-dot { fill: #ffffff; opacity: 0; }

      #stats { position: absolute; left: 48px; right: 48px; bottom: 104px; }
      #stats .st-inner { opacity: 0; display: flex; justify-content: space-between; align-items: center; padding: 30px 34px; border-radius: 24px; background: rgba(0,0,0,0.52); border: 1px solid rgba(255,255,255,0.18); }
      #stats .st-cell { display: flex; flex-direction: column; align-items: center; flex: 1; }
      #stats .st-val { font-size: 58px; font-weight: 800; color: #f6f6f4; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.02em; }
      #stats .st-val .u { font-size: 26px; font-weight: 700; color: rgba(246,246,244,0.8); margin-left: 5px; }
      #stats .st-key { margin-top: 13px; font-size: 23px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(246,246,244,0.7); }
      #stats .st-div { width: 1px; height: 76px; background: rgba(255,255,255,0.2); }

      #progress { position: absolute; left: 0; bottom: 0; height: 7px; width: 100%; transform-origin: left center; transform: scaleX(0); background: #ffffff; box-shadow: 0 -1px 12px rgba(255,255,255,0.5); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18.47" data-width="1080" data-height="1920">
      <video id="a-roll" class="clip" src="combined.mp4" muted playsinline data-start="0" data-duration="18.47" data-track-index="0" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover"></video>

      <!-- Monochrome grade -->
      <div class="grade grade-contrast"></div>
      <div class="grade grade-vignette"></div>
      <div class="grade grade-grain"></div>

      <!-- Opening kicker -->
      <div id="beat-a" class="clip beat" style="top: 150px" data-start="0.3" data-duration="1.9" data-track-index="4">
        <div class="beat-inner"><div class="kicker">07:12 AM<span class="dot">·</span>7.5 KM</div></div>
      </div>
      <!-- Opening title -->
      <div id="beat-open" class="clip beat" style="top: 1360px" data-start="0.4" data-duration="1.9" data-track-index="9">
        <div class="beat-inner"><div class="line"><span>Sunday</span><span class="accent">miles</span></div></div>
      </div>

      <!-- Run beat B -->
      <div id="beat-b" class="clip beat" style="top: 980px" data-start="3.2" data-duration="3.4" data-track-index="4">
        <div class="beat-inner"><div class="rule"></div><div class="line"><span>One step</span><span class="accent">at a time</span></div></div>
      </div>
      <!-- Run beat C -->
      <div id="beat-c" class="clip beat" style="top: 1010px" data-start="9.7" data-duration="3.4" data-track-index="4">
        <div class="beat-inner"><div class="rule"></div><div class="line"><span>Don't</span><span class="accent">stop</span></div></div>
      </div>

      <!-- HUD corners -->
      <div id="hud-corners" class="clip" style="position:absolute; inset:0; pointer-events:none" data-start="0.4" data-duration="14.2" data-track-index="3">
        <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      </div>

      <!-- Telemetry -->
      <div id="telemetry" class="clip" data-start="3.0" data-duration="11.6" data-track-index="6">
        <div class="tele-inner"><span class="tele-dot"></span><span class="tele-label">Tracking</span><span class="tele-time" id="tele-time">0:00</span></div>
      </div>

      <!-- Pace sparkline -->
      <div id="pace" class="clip" data-start="3.6" data-duration="11.0" data-track-index="7">
        <div class="pc-inner">
          <div class="pc-title"><span>Pace / km</span><span>6:00</span></div>
          <svg viewBox="0 0 214 72" xmlns="http://www.w3.org/2000/svg">
            <polyline id="pc-line" points="" />
            <circle class="pc-dot" id="pc-dot" cx="0" cy="0" r="6" />
          </svg>
        </div>
      </div>

      <!-- Stats bar -->
      <div id="stats" class="clip" data-start="3.3" data-duration="11.3" data-track-index="8">
        <div class="st-inner">
          <div class="st-cell"><div class="st-val"><span id="st-dist">0.0</span><span class="u">km</span></div><div class="st-key">Distance</div></div>
          <div class="st-div"></div>
          <div class="st-cell"><div class="st-val"><span id="st-pace">6:00</span><span class="u">/km</span></div><div class="st-key">Avg Pace</div></div>
          <div class="st-div"></div>
          <div class="st-cell"><div class="st-val"><span id="st-cal">0</span><span class="u">kcal</span></div><div class="st-key">Calories</div></div>
        </div>
      </div>

      <!-- Closing -->
      <div id="closing" class="clip" data-start="15.3" data-duration="3.17" data-track-index="5">
        <div class="scrim"></div>
        <div class="card-inner">
          <div class="mark">
            <svg width="66" height="66" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="17" cy="5" r="2" />
              <path d="M6.5 21 9 14l4-2-3-4-3 2-2 3" />
              <path d="M13 12l3 2 1 4" />
              <path d="M10 8l4 1 3-3" />
            </svg>
          </div>
          <div class="handle">@tedyatra</div>
          <div class="sub">7.5 km · 45:00 · 6:00 /km</div>
        </div>
      </div>

      <div id="progress"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      function beat(id, start, dur) {
        const inner = "#" + id + " .beat-inner";
        tl.fromTo(inner, { autoAlpha: 0, y: 46 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: "power3.out", immediateRender: false }, start);
        const rule = "#" + id + " .rule";
        if (document.querySelector(rule)) {
          tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.out", immediateRender: false }, start + 0.1);
        }
        tl.to(inner, { autoAlpha: 0, y: -26, duration: 0.45, ease: "power2.in" }, start + dur - 0.45);
      }
      beat("beat-a", 0.3, 1.9);
      beat("beat-open", 0.4, 1.9);
      beat("beat-b", 3.2, 3.4);
      beat("beat-c", 9.7, 3.4);

      // Closing card
      tl.fromTo("#closing .card-inner", { autoAlpha: 0, y: 40, scale: 0.94 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.9, ease: "power3.out", immediateRender: false }, 15.6);

      // Progress line
      tl.fromTo("#progress", { scaleX: 0 }, { scaleX: 1, duration: 18.47, ease: "none", immediateRender: false }, 0);

      // ---------- Motion graphics: run telemetry HUD ----------
      const HUD_OUT = 14.1;
      gsap.set(".corner", { transformOrigin: "center center" });
      tl.fromTo(".corner", { autoAlpha: 0, scale: 0.4 }, { autoAlpha: 0.85, scale: 1, duration: 0.7, ease: "power3.out", stagger: 0.08, immediateRender: false }, 0.5);
      tl.to(".corner", { autoAlpha: 0, duration: 0.5, ease: "power2.in" }, HUD_OUT);

      // Telemetry chip + run clock -> 45:00
      tl.fromTo("#telemetry .tele-inner", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 3.1);
      tl.fromTo(".tele-dot", { scale: 0.7, autoAlpha: 0.6 }, { scale: 1.15, autoAlpha: 1, duration: 0.7, ease: "sine.inOut", repeat: 8, yoyo: true, immediateRender: false }, 3.4);
      const teleState = { v: 0 };
      const teleEl = document.getElementById("tele-time");
      tl.to(teleState, { v: 2700, duration: 4, ease: "power2.out", onUpdate: () => { const s = Math.round(teleState.v); teleEl.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); } }, 3.4);
      tl.to("#telemetry .tele-inner", { autoAlpha: 0, x: -20, duration: 0.5, ease: "power2.in" }, HUD_OUT);

      // Pace sparkline (per-km splits, deterministic)
      const paces = [382, 366, 358, 361, 350, 372, 346]; // sec/km
      const pmin = Math.min(...paces), pmax = Math.max(...paces);
      const PW = 214, PH = 72, pad = 10;
      const pts = paces.map((p, i) => {
        const x = pad + (PW - 2 * pad) * (i / (paces.length - 1));
        const y = pad + (PH - 2 * pad) * ((p - pmin) / (pmax - pmin || 1)); // faster (lower sec) = higher line
        return [x, y];
      });
      const line = document.getElementById("pc-line");
      line.setAttribute("points", pts.map(([x, y]) => x.toFixed(1) + "," + y.toFixed(1)).join(" "));
      const last = pts[pts.length - 1];
      const dotEl = document.getElementById("pc-dot");
      dotEl.setAttribute("cx", last[0].toFixed(1));
      dotEl.setAttribute("cy", last[1].toFixed(1));
      const plen = line.getTotalLength();
      line.style.strokeDasharray = plen;
      line.style.strokeDashoffset = plen;
      tl.fromTo("#pace .pc-inner", { autoAlpha: 0, y: -24 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 3.7);
      tl.to(line, { strokeDashoffset: 0, duration: 1.5, ease: "power1.inOut" }, 4.1);
      tl.fromTo("#pc-dot", { autoAlpha: 0, scale: 0 }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: "back.out(2)", transformOrigin: "center center", immediateRender: false }, 5.5);
      tl.to("#pace .pc-inner", { autoAlpha: 0, y: -20, duration: 0.5, ease: "power2.in" }, HUD_OUT);

      // Stats bar: distance + calories count up, pace fixed
      tl.fromTo("#stats .st-inner", { autoAlpha: 0, y: 60 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: "power3.out", immediateRender: false }, 3.4);
      function countUp(id, target, decimals, at) {
        const o = { v: 0 }, el = document.getElementById(id);
        tl.to(o, { v: target, duration: 1.6, ease: "power2.out", onUpdate: () => { el.textContent = decimals ? o.v.toFixed(decimals) : String(Math.round(o.v)); } }, at);
      }
      countUp("st-dist", 7.5, 1, 3.8);
      countUp("st-cal", 486, 0, 3.8);
      tl.to("#stats .st-inner", { autoAlpha: 0, y: 40, duration: 0.5, ease: "power2.in" }, HUD_OUT);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
