<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      }

      /* ---- Cinematic grade layers (always-on, non-clip children) ---- */
      .grade {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      /* warm highlights / teal shadows split-tone */
      .grade-tone {
        background:
          radial-gradient(120% 80% at 50% 8%, rgba(255, 196, 92, 0.28), rgba(255, 196, 92, 0) 55%),
          linear-gradient(200deg, rgba(255, 168, 76, 0.12), rgba(20, 40, 60, 0.16));
        mix-blend-mode: soft-light;
      }
      .grade-contrast {
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, 0) 70%, rgba(0, 0, 0, 0.22));
        mix-blend-mode: multiply;
        opacity: 0.9;
      }
      /* vignette */
      .grade-vignette {
        background: radial-gradient(ellipse 78% 64% at 50% 46%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%);
      }
      /* deterministic film grain via seeded SVG turbulence */
      .grade-grain {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='7' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
        background-size: 320px 320px;
        opacity: 0.07;
        mix-blend-mode: overlay;
      }

      /* ---- Type ---- */
      .beat {
        position: absolute;
        left: 0;
        right: 0;
        padding: 0 96px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .beat-inner {
        opacity: 0;
        will-change: transform, opacity;
      }
      .kicker {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: #ffd77a;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
      }
      .kicker .dot {
        color: rgba(255, 255, 255, 0.55);
        margin: 0 0.5em;
      }
      .line {
        font-size: 108px;
        line-height: 0.98;
        font-weight: 800;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        color: #f7f4ee;
        text-shadow: 0 4px 40px rgba(0, 0, 0, 0.6);
      }
      .line span {
        display: block;
      }
      .line .accent {
        color: #ffc45c;
      }
      .rule {
        width: 92px;
        height: 6px;
        background: #ffc45c;
        margin-bottom: 34px;
        transform-origin: left center;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.5);
      }

      /* ---- Closing card ---- */
      #closing {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #closing .card-inner {
        opacity: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        will-change: transform, opacity;
      }
      .mark {
        width: 132px;
        height: 132px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 40px;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      }
      .handle {
        font-size: 84px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #f7f4ee;
        text-shadow: 0 4px 34px rgba(0, 0, 0, 0.6);
      }
      .tagline {
        margin-top: 22px;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #ffd77a;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.1) 30%, rgba(0, 0, 0, 0.1) 60%, rgba(0, 0, 0, 0.62));
      }

      /* ---- Motion-graphics HUD ---- */
      /* Viewfinder corner brackets */
      .corner {
        position: absolute;
        width: 78px;
        height: 78px;
        border: 5px solid rgba(255, 196, 92, 0.85);
        opacity: 0;
      }
      .corner.tl { top: 46px; left: 46px; border-right: none; border-bottom: none; }
      .corner.tr { top: 46px; right: 46px; border-left: none; border-bottom: none; }
      .corner.bl { bottom: 46px; left: 46px; border-right: none; border-top: none; }
      .corner.br { bottom: 46px; right: 46px; border-left: none; border-top: none; }

      /* Telemetry chip (top-left) */
      #telemetry { position: absolute; top: 150px; left: 64px; }
      #telemetry .tele-inner {
        display: flex;
        align-items: center;
        gap: 16px;
        opacity: 0;
        padding: 14px 26px;
        border-radius: 999px;
        background: rgba(10, 12, 16, 0.44);
        border: 1px solid rgba(255, 255, 255, 0.16);
      }
      .tele-dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #ff5a4d;
        box-shadow: 0 0 16px rgba(255, 90, 77, 0.9);
      }
      .tele-label {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #f7f4ee;
      }
      .tele-time {
        font-size: 26px;
        font-weight: 700;
        color: #ffd77a;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
      }

      /* Route mini-map (top-right) */
      #routemap { position: absolute; top: 150px; right: 64px; }
      #routemap .rm-inner {
        opacity: 0;
        width: 240px;
        padding: 18px 20px 12px;
        border-radius: 22px;
        background: rgba(10, 12, 16, 0.44);
        border: 1px solid rgba(255, 255, 255, 0.16);
      }
      #routemap .rm-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(247, 244, 238, 0.82);
        margin-bottom: 6px;
      }
      #routemap svg { display: block; width: 100%; height: 120px; }
      #routemap path {
        fill: none;
        stroke: #ffc45c;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #routemap .rm-pin { fill: #ffffff; opacity: 0; }

      /* Stats HUD bar (bottom) */
      #stats { position: absolute; left: 48px; right: 48px; bottom: 104px; }
      #stats .st-inner {
        opacity: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 30px 34px;
        border-radius: 26px;
        background: linear-gradient(180deg, rgba(12, 14, 18, 0.5), rgba(12, 14, 18, 0.64));
        border: 1px solid rgba(255, 255, 255, 0.14);
      }
      #stats .st-cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
      }
      #stats .st-val {
        font-size: 58px;
        font-weight: 800;
        color: #f7f4ee;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      #stats .st-val .u {
        font-size: 27px;
        font-weight: 700;
        color: #ffd77a;
        margin-left: 6px;
      }
      #stats .st-key {
        margin-top: 14px;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(247, 244, 238, 0.72);
      }
      #stats .st-div { width: 1px; height: 78px; background: rgba(255, 255, 255, 0.16); }

      /* ---- Progress line ---- */
      #progress {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 8px;
        width: 100%;
        transform-origin: left center;
        transform: scaleX(0);
        background: linear-gradient(90deg, #ffc45c, #ffd77a);
        box-shadow: 0 -1px 14px rgba(255, 196, 92, 0.5);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="31.17"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="a-roll"
        class="clip"
        src="bike.mp4"
        muted
        playsinline
        data-start="0"
        data-duration="31.17"
        data-track-index="0"
        style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"
      ></video>
      <audio
        id="a-roll-audio"
        src="bike.mp4"
        data-start="0"
        data-duration="31.17"
        data-track-index="2"
        data-volume="1"
      ></audio>

      <!-- Grade stack (always-on decorative children) -->
      <div class="grade grade-tone"></div>
      <div class="grade grade-contrast"></div>
      <div class="grade grade-vignette"></div>

      <!-- Beat A — kicker -->
      <div
        id="beat-a"
        class="clip beat"
        style="top: 168px"
        data-start="0.6"
        data-duration="4.2"
        data-track-index="4"
      >
        <div class="beat-inner">
          <div class="kicker">05:16 AM<span class="dot">·</span>Sunrise Session</div>
        </div>
      </div>

      <!-- Beat B -->
      <div
        id="beat-b"
        class="clip beat"
        style="top: 980px"
        data-start="5"
        data-duration="4.6"
        data-track-index="4"
      >
        <div class="beat-inner">
          <div class="rule"></div>
          <div class="line"><span>The city's</span><span>still asleep</span></div>
        </div>
      </div>

      <!-- Beat C -->
      <div
        id="beat-c"
        class="clip beat"
        style="top: 1040px"
        data-start="12"
        data-duration="4.6"
        data-track-index="4"
      >
        <div class="beat-inner">
          <div class="rule"></div>
          <div class="line"><span>The road</span><span class="accent">isn't.</span></div>
        </div>
      </div>

      <!-- Beat D -->
      <div
        id="beat-d"
        class="clip beat"
        style="top: 980px"
        data-start="19"
        data-duration="5"
        data-track-index="4"
      >
        <div class="beat-inner">
          <div class="rule"></div>
          <div class="line"><span>Earn your</span><span class="accent">sunrise</span></div>
        </div>
      </div>

      <!-- Closing card -->
      <div
        id="closing"
        class="clip"
        data-start="25.2"
        data-duration="5.97"
        data-track-index="5"
      >
        <div class="scrim"></div>
        <div class="card-inner">
          <div class="mark">
            <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="5.5" cy="17.5" r="3.5" />
              <circle cx="18.5" cy="17.5" r="3.5" />
              <path d="M15 17.5 9 8h5l3 5" />
              <path d="M9 8 7.5 5.5H5" />
              <path d="M12 8h6" />
            </svg>
          </div>
          <div class="handle">@tedyatra</div>
          <div class="tagline">Chasing Light</div>
        </div>
      </div>

      <!-- Motion graphics: viewfinder corner brackets -->
      <div
        id="hud-corners"
        class="clip"
        style="position: absolute; inset: 0; pointer-events: none"
        data-start="0.4"
        data-duration="24.5"
        data-track-index="3"
      >
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
      </div>

      <!-- Motion graphics: telemetry chip -->
      <div
        id="telemetry"
        class="clip"
        data-start="5.2"
        data-duration="19.7"
        data-track-index="6"
      >
        <div class="tele-inner">
          <span class="tele-dot"></span>
          <span class="tele-label">Tracking</span>
          <span class="tele-time" id="tele-time">0:00</span>
        </div>
      </div>

      <!-- Motion graphics: route mini-map -->
      <div
        id="routemap"
        class="clip"
        data-start="6.3"
        data-duration="18.6"
        data-track-index="7"
      >
        <div class="rm-inner">
          <div class="rm-title">Route</div>
          <svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
            <path id="rm-path" d="M118.1 68.7 L117.8 68.5 L117.6 68.9 L115.7 68.7 L113.6 70.5 L113.3 75.2 L110.2 75.5 L109.8 84.4 L109.2 90.7 L105.5 101.0 L106.9 102.7 L112.4 101.8 L116.3 99.7 L120.2 99.5 L125.0 99.7 L132.1 99.6 L142.9 98.2 L146.2 97.7 L147.9 93.7 L148.5 91.8 L147.6 98.1 L144.1 98.7 L138.5 99.4 L129.2 100.3 L122.5 99.9 L111.2 103.3 L108.3 103.7 L105.4 100.7 L106.3 97.5 L108.0 92.9 L109.4 85.7 L109.4 78.8 L109.6 75.8 L109.8 70.0 L109.5 62.7 L107.7 60.0 L97.1 60.7 L92.6 61.0 L82.8 61.6 L74.7 60.0 L69.5 58.6 L70.2 48.7 L71.4 34.5 L65.0 32.5 L57.5 32.6 L51.5 32.0 L56.2 23.1 L57.0 18.3 L57.3 18.5 L55.1 25.7 L54.7 26.3 L51.8 32.3 L62.2 32.5 L66.6 32.4 L71.9 32.7 L71.9 34.8 L71.5 42.9 L70.6 53.5 L70.3 59.4 L75.4 59.8 L81.0 61.0 L86.5 61.0 L95.3 60.7 L100.0 60.2 L105.8 59.9 L109.7 59.9 L110.4 65.9 L113.6 67.2 L113.1 66.3 L113.2 63.5 L113.2 63.6 L113.2 63.5" />
            <circle class="rm-pin" id="rm-pin" cx="113.2" cy="63.5" r="7" />
          </svg>
        </div>
      </div>

      <!-- Motion graphics: ride-stats HUD -->
      <div
        id="stats"
        class="clip"
        data-start="5.5"
        data-duration="19.4"
        data-track-index="8"
      >
        <div class="st-inner">
          <div class="st-cell">
            <div class="st-val"><span class="st-num" id="st-dist">0.0</span><span class="u">km</span></div>
            <div class="st-key">Distance</div>
          </div>
          <div class="st-div"></div>
          <div class="st-cell">
            <div class="st-val"><span class="st-num" id="st-avg">0.0</span><span class="u">km/h</span></div>
            <div class="st-key">Avg Speed</div>
          </div>
          <div class="st-div"></div>
          <div class="st-cell">
            <div class="st-val"><span class="st-num" id="st-elev">0</span><span class="u">m</span></div>
            <div class="st-key">Elevation</div>
          </div>
        </div>
      </div>

      <!-- Progress line (always-on) -->
      <div id="progress"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Reveal a text beat: inner starts hidden (CSS), rises in, then lifts out.
      function beat(id, start, dur) {
        const inner = "#" + id + " .beat-inner";
        tl.fromTo(
          inner,
          { autoAlpha: 0, y: 46 },
          { autoAlpha: 1, y: 0, duration: 0.7, ease: "power3.out", immediateRender: false },
          start
        );
        // accent rule wipes in
        const rule = "#" + id + " .rule";
        if (document.querySelector(rule)) {
          tl.fromTo(
            rule,
            { scaleX: 0 },
            { scaleX: 1, duration: 0.6, ease: "power3.out", immediateRender: false },
            start + 0.12
          );
        }
        tl.to(inner, { autoAlpha: 0, y: -26, duration: 0.5, ease: "power2.in" }, start + dur - 0.5);
      }

      beat("beat-a", 0.6, 4.2);
      beat("beat-b", 5, 4.6);
      beat("beat-c", 12, 4.6);
      beat("beat-d", 19, 5);

      // Closing card
      tl.fromTo(
        "#closing .card-inner",
        { autoAlpha: 0, y: 40, scale: 0.94 },
        { autoAlpha: 1, y: 0, scale: 1, duration: 0.9, ease: "power3.out", immediateRender: false },
        25.5
      );

      // Progress line spans the whole piece
      tl.fromTo("#progress", { scaleX: 0 }, { scaleX: 1, duration: 31.17, ease: "none", immediateRender: false }, 0);

      // ---------- Motion graphics: ride telemetry HUD ----------
      const HUD_OUT = 24.4; // everything clears before the closing card (25.2)

      // Viewfinder corner brackets scale in, hold, fade out
      gsap.set(".corner", { transformOrigin: "center center" });
      tl.fromTo(
        ".corner",
        { autoAlpha: 0, scale: 0.4 },
        { autoAlpha: 0.85, scale: 1, duration: 0.7, ease: "power3.out", stagger: 0.08, immediateRender: false },
        0.5
      );
      tl.to(".corner", { autoAlpha: 0, duration: 0.5, ease: "power2.in" }, HUD_OUT);

      // Telemetry chip: slide in, pulsing REC dot, live count-up timer
      tl.fromTo(
        "#telemetry .tele-inner",
        { autoAlpha: 0, x: -30 },
        { autoAlpha: 1, x: 0, duration: 0.6, ease: "power3.out", immediateRender: false },
        5.3
      );
      tl.fromTo(
        ".tele-dot",
        { scale: 0.7, autoAlpha: 0.6 },
        { scale: 1.15, autoAlpha: 1, duration: 0.7, ease: "sine.inOut", repeat: 12, yoyo: true, immediateRender: false },
        5.6
      );
      // Ride moving time counts up to the real 41:04, then holds
      const teleState = { v: 0 };
      const teleEl = document.getElementById("tele-time");
      tl.to(
        teleState,
        {
          v: 2464,
          duration: 4,
          ease: "power2.out",
          onUpdate: () => {
            const s = Math.round(teleState.v);
            teleEl.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
          },
        },
        5.6
      );
      tl.to("#telemetry .tele-inner", { autoAlpha: 0, x: -20, duration: 0.5, ease: "power2.in" }, HUD_OUT);

      // Route mini-map: panel in, path draws itself, pin drops
      tl.fromTo(
        "#routemap .rm-inner",
        { autoAlpha: 0, y: -24 },
        { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out", immediateRender: false },
        6.4
      );
      const rmPath = document.getElementById("rm-path");
      const rmLen = rmPath.getTotalLength();
      rmPath.style.strokeDasharray = rmLen;
      rmPath.style.strokeDashoffset = rmLen;
      tl.to(rmPath, { strokeDashoffset: 0, duration: 1.5, ease: "power1.inOut" }, 6.9);
      tl.fromTo(
        "#rm-pin",
        { autoAlpha: 0, scale: 0 },
        { autoAlpha: 1, scale: 1, duration: 0.4, ease: "back.out(2)", transformOrigin: "center center", immediateRender: false },
        8.3
      );
      tl.to("#routemap .rm-inner", { autoAlpha: 0, y: -20, duration: 0.5, ease: "power2.in" }, HUD_OUT);

      // Ride-stats HUD: slide up, three synchronized count-ups (a chord)
      tl.fromTo(
        "#stats .st-inner",
        { autoAlpha: 0, y: 60 },
        { autoAlpha: 1, y: 0, duration: 0.7, ease: "power3.out", immediateRender: false },
        5.6
      );
      function countUp(id, target, decimals, at) {
        const o = { v: 0 };
        const el = document.getElementById(id);
        tl.to(
          o,
          {
            v: target,
            duration: 1.6,
            ease: "power2.out",
            onUpdate: () => {
              el.textContent = decimals ? o.v.toFixed(decimals) : String(Math.round(o.v));
            },
          },
          at
        );
      }
      countUp("st-dist", 12.1, 1, 6.0);
      countUp("st-avg", 17.6, 1, 6.0);
      countUp("st-elev", 37, 0, 6.0);
      tl.to("#stats .st-inner", { autoAlpha: 0, y: 40, duration: 0.5, ease: "power2.in" }, HUD_OUT);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
