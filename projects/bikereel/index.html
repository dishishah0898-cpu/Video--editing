<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      }

      /* ---- Cinematic grade layers (always-on, non-clip children) ---- */
      .grade {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      /* warm highlights / teal shadows split-tone */
      .grade-tone {
        background:
          radial-gradient(120% 80% at 50% 8%, rgba(255, 196, 92, 0.28), rgba(255, 196, 92, 0) 55%),
          linear-gradient(200deg, rgba(255, 168, 76, 0.12), rgba(20, 40, 60, 0.16));
        mix-blend-mode: soft-light;
      }
      .grade-contrast {
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, 0) 70%, rgba(0, 0, 0, 0.22));
        mix-blend-mode: multiply;
        opacity: 0.9;
      }
      /* vignette */
      .grade-vignette {
        background: radial-gradient(ellipse 78% 64% at 50% 46%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%);
      }
      /* deterministic film grain via seeded SVG turbulence */
      .grade-grain {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='7' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
        background-size: 320px 320px;
        opacity: 0.07;
        mix-blend-mode: overlay;
      }

      /* ---- Type ---- */
      .beat {
        position: absolute;
        left: 0;
        right: 0;
        padding: 0 96px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .beat-inner {
        opacity: 0;
        will-change: transform, opacity;
      }
      .kicker {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: #ffd77a;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
      }
      .kicker .dot {
        color: rgba(255, 255, 255, 0.55);
        margin: 0 0.5em;
      }
      .line {
        font-size: 108px;
        line-height: 0.98;
        font-weight: 800;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        color: #f7f4ee;
        text-shadow: 0 4px 40px rgba(0, 0, 0, 0.6);
      }
      .line span {
        display: block;
      }
      .line .accent {
        color: #ffc45c;
      }
      .rule {
        width: 92px;
        height: 6px;
        background: #ffc45c;
        margin-bottom: 34px;
        transform-origin: left center;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.5);
      }

      /* ---- Closing card ---- */
      #closing {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #closing .card-inner {
        opacity: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        will-change: transform, opacity;
      }
      .mark {
        width: 132px;
        height: 132px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 40px;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      }
      .handle {
        font-size: 84px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #f7f4ee;
        text-shadow: 0 4px 34px rgba(0, 0, 0, 0.6);
      }
      .tagline {
        margin-top: 22px;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #ffd77a;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.1) 30%, rgba(0, 0, 0, 0.1) 60%, rgba(0, 0, 0, 0.62));
      }

      /* ---- Progress line ---- */
      #progress {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 8px;
        width: 100%;
        transform-origin: left center;
        transform: scaleX(0);
        background: linear-gradient(90deg, #ffc45c, #ffd77a);
        box-shadow: 0 -1px 14px rgba(255, 196, 92, 0.5);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="31.17"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="a-roll"
        class="clip"
        src="bike.mp4"
        muted
        playsinline
        data-start="0"
        data-duration="31.17"
        data-track-index="0"
        style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"
      ></video>
      <audio
        id="a-roll-audio"
        src="bike.mp4"
        data-start="0"
        data-duration="31.17"
        data-track-index="2"
        data-volume="1"
      ></audio>

      <!-- Grade stack (always-on decorative children) -->
      <div class="grade grade-tone"></div>
      <div class="grade grade-contrast"></div>
      <div class="grade grade-vignette"></div>

      <!-- Beat A — kicker -->
      <div
        id="beat-a"
        class="clip beat"
        style="top: 168px"
        data-start="0.6"
        data-duration="4.2"
        data-track-index="4"
      >
        <div class="beat-inner">
          <div class="kicker">05:47 AM<span class="dot">·</span>Sunrise Session</div>
        </div>
      </div>

      <!-- Beat B -->
      <div
        id="beat-b"
        class="clip beat"
        style="top: 980px"
        data-start="5"
        data-duration="4.6"
        data-track-index="4"
      >
        <div class="beat-inner">
          <div class="rule"></div>
          <div class="line"><span>The city's</span><span>still asleep</span></div>
        </div>
      </div>

      <!-- Beat C -->
      <div
        id="beat-c"
        class="clip beat"
        style="top: 1040px"
        data-start="12"
        data-duration="4.6"
        data-track-index="4"
      >
        <div class="beat-inner">
          <div class="rule"></div>
          <div class="line"><span>The road</span><span class="accent">isn't.</span></div>
        </div>
      </div>

      <!-- Beat D -->
      <div
        id="beat-d"
        class="clip beat"
        style="top: 980px"
        data-start="19"
        data-duration="5"
        data-track-index="4"
      >
        <div class="beat-inner">
          <div class="rule"></div>
          <div class="line"><span>Earn your</span><span class="accent">sunrise</span></div>
        </div>
      </div>

      <!-- Closing card -->
      <div
        id="closing"
        class="clip"
        data-start="25.2"
        data-duration="5.97"
        data-track-index="5"
      >
        <div class="scrim"></div>
        <div class="card-inner">
          <div class="mark">
            <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="5.5" cy="17.5" r="3.5" />
              <circle cx="18.5" cy="17.5" r="3.5" />
              <path d="M15 17.5 9 8h5l3 5" />
              <path d="M9 8 7.5 5.5H5" />
              <path d="M12 8h6" />
            </svg>
          </div>
          <div class="handle">@tedyatra</div>
          <div class="tagline">Chasing Light</div>
        </div>
      </div>

      <!-- Progress line (always-on) -->
      <div id="progress"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Reveal a text beat: inner starts hidden (CSS), rises in, then lifts out.
      function beat(id, start, dur) {
        const inner = "#" + id + " .beat-inner";
        tl.fromTo(
          inner,
          { autoAlpha: 0, y: 46 },
          { autoAlpha: 1, y: 0, duration: 0.7, ease: "power3.out", immediateRender: false },
          start
        );
        // accent rule wipes in
        const rule = "#" + id + " .rule";
        if (document.querySelector(rule)) {
          tl.fromTo(
            rule,
            { scaleX: 0 },
            { scaleX: 1, duration: 0.6, ease: "power3.out", immediateRender: false },
            start + 0.12
          );
        }
        tl.to(inner, { autoAlpha: 0, y: -26, duration: 0.5, ease: "power2.in" }, start + dur - 0.5);
      }

      beat("beat-a", 0.6, 4.2);
      beat("beat-b", 5, 4.6);
      beat("beat-c", 12, 4.6);
      beat("beat-d", 19, 5);

      // Closing card
      tl.fromTo(
        "#closing .card-inner",
        { autoAlpha: 0, y: 40, scale: 0.94 },
        { autoAlpha: 1, y: 0, scale: 1, duration: 0.9, ease: "power3.out", immediateRender: false },
        25.5
      );

      // Progress line spans the whole piece
      tl.fromTo("#progress", { scaleX: 0 }, { scaleX: 1, duration: 31.17, ease: "none", immediateRender: false }, 0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
